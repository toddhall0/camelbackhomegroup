<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phoenix Neighborhoods — Camelback Home Group</title>
<meta name="description" content="Explore Phoenix metro neighborhoods and search homes by area. Camelback Home Group — your Valley-wide real estate brokerage.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--charcoal:#1f4e60;--charcoal-mid:#275d72;--gold:#cc624c;--gold-light:#d97965;
--gold-pale:#f2ddd7;--cream:#f2f0ec;--cream-dark:#e6e1da;--sand:#c4b8a8;
--terracotta:#cc624c;--teal:#1f4e60;--teal-dark:#163a49;--teal-light:#2d6b80;
--text-dark:#162d38;--text-mid:#3d5a68;--text-light:#6a8290;
--white:#FFFFFF;--font-serif:'Cormorant Garamond',Georgia,serif;
--font-sans:'Jost',Helvetica,Arial,sans-serif;
}
body{font-family:var(--font-sans);color:var(--text-dark);margin:0;overflow-x:hidden}
a{text-decoration:none;color:inherit}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;
background:rgba(22,58,73,0.94);backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);padding:0 32px}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;
justify-content:space-between;height:72px}
.nav-brand{display:flex;align-items:center;gap:14px}
.nav-brand-text{display:flex;flex-direction:column}
.nav-brand-name{font-family:var(--font-serif);font-size:1.1rem;color:var(--white);font-weight:500;line-height:1.2}
.nav-brand-sub{font-size:0.75rem;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);line-height:1}
.nav-links{display:flex;align-items:center;gap:32px}
.nav-link{font-size:0.92rem;font-weight:400;color:rgba(255,255,255,0.75);transition:color 0.3s}
.nav-link:hover{color:var(--white)}
.nav-cta{font-size:0.88rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;
color:var(--gold);border:1px solid var(--gold);padding:9px 22px;transition:all 0.3s}
.nav-cta:hover{background:var(--gold);color:var(--white)}
.nav-mobile-toggle{display:none;background:none;border:none;cursor:pointer;padding:8px}
.nav-mobile-toggle span{display:block;width:24px;height:2px;background:var(--white);margin:5px 0;transition:all 0.3s}

/* MAP LAYOUT */
.map-page{display:flex;flex-direction:column;height:100vh;padding-top:72px}
.map-header{background:var(--charcoal);padding:24px 32px;text-align:center}
.map-header h1{font-family:var(--font-serif);font-size:1.6rem;font-weight:400;color:var(--white);margin-bottom:4px}
.map-header p{font-size:0.92rem;font-weight:300;color:rgba(255,255,255,0.55)}

/* MAP + PANEL CONTAINER */
.map-body{flex:1;display:flex;position:relative;overflow:hidden}
.map-container{flex:1;position:relative;min-width:0;transition:flex 0.35s ease}
#map{width:100%;height:100%;z-index:1}

/* LISTINGS SIDE PANEL */
.listings-panel{
  width:0;min-width:0;overflow:hidden;
  background:var(--white);
  display:flex;flex-direction:column;
  border-left:1px solid var(--cream-dark);
  transition:width 0.35s ease, min-width 0.35s ease;
  position:relative;z-index:2;
}
.listings-panel.open{
  width:38%;min-width:340px;
}

/* Panel header */
.panel-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;background:var(--charcoal);color:var(--white);
  flex-shrink:0;
}
.panel-header-text{flex:1;min-width:0}
.panel-area-name{
  font-family:var(--font-serif);font-size:1.15rem;font-weight:500;
  color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.panel-listing-count{font-size:0.78rem;color:rgba(255,255,255,0.6);margin-top:2px}
.panel-close-btn{
  background:none;border:1px solid rgba(255,255,255,0.25);color:var(--white);
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;margin-left:12px;font-size:1.1rem;
  transition:background 0.2s, border-color 0.2s;
}
.panel-close-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.5)}

/* Filter bar */
.panel-filters{
  padding:14px 20px;background:var(--cream);border-bottom:1px solid var(--cream-dark);
  flex-shrink:0;
}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:3px;flex:1;min-width:80px}
.filter-group label{font-size:0.7rem;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-light)}
.filter-group input,
.filter-group select{
  font-family:var(--font-sans);font-size:0.82rem;
  padding:7px 10px;border:1px solid var(--cream-dark);background:var(--white);
  color:var(--text-dark);outline:none;transition:border-color 0.2s;
}
.filter-group input:focus,
.filter-group select:focus{border-color:var(--charcoal)}
.filter-group input::placeholder{color:var(--text-light)}
.filter-actions{display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
.filter-apply-btn{
  font-family:var(--font-sans);font-size:0.78rem;font-weight:500;
  letter-spacing:0.06em;text-transform:uppercase;
  padding:8px 16px;background:var(--gold);color:var(--white);
  border:none;cursor:pointer;transition:background 0.2s;white-space:nowrap;
}
.filter-apply-btn:hover{background:var(--gold-light)}
.filter-reset-btn{
  font-family:var(--font-sans);font-size:0.75rem;font-weight:400;
  color:var(--text-light);background:none;border:none;cursor:pointer;
  padding:8px 4px;white-space:nowrap;transition:color 0.2s;
}
.filter-reset-btn:hover{color:var(--text-dark)}

/* Listing cards list */
.panel-listings{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:0;
}
.panel-listings::-webkit-scrollbar{width:6px}
.panel-listings::-webkit-scrollbar-track{background:var(--cream)}
.panel-listings::-webkit-scrollbar-thumb{background:var(--sand);border-radius:3px}
.panel-listings::-webkit-scrollbar-thumb:hover{background:var(--text-light)}

/* Empty / loading states */
.panel-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 24px;text-align:center;color:var(--text-light);
}
.panel-empty-icon{font-size:2.4rem;margin-bottom:12px;opacity:0.4}
.panel-empty-text{font-size:0.92rem;line-height:1.5}
.panel-loading{
  display:flex;align-items:center;justify-content:center;
  padding:60px 24px;color:var(--text-light);font-size:0.92rem;gap:10px;
}
.panel-loading-spinner{
  width:20px;height:20px;border:2px solid var(--cream-dark);
  border-top-color:var(--gold);border-radius:50%;
  animation:panelSpin 0.8s linear infinite;
}
@keyframes panelSpin{to{transform:rotate(360deg)}}

/* Listing card */
.listing-card{
  display:flex;gap:14px;padding:16px 20px;
  border-bottom:1px solid var(--cream);
  cursor:pointer;transition:background 0.15s;
}
.listing-card:hover{background:var(--cream)}
.listing-card.active{background:var(--gold-pale)}
.listing-card-photo{
  width:110px;height:82px;flex-shrink:0;overflow:hidden;
  background:var(--cream-dark);position:relative;
}
.listing-card-photo img{width:100%;height:100%;object-fit:cover}
.listing-card-photo-placeholder{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  color:var(--text-light);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;
}
.listing-card-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.listing-card-price{
  font-family:var(--font-serif);font-size:1.15rem;font-weight:600;
  color:var(--text-dark);margin-bottom:3px;
}
.listing-card-address{
  font-size:0.8rem;color:var(--text-mid);margin-bottom:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.listing-card-details{display:flex;gap:10px;font-size:0.78rem;color:var(--text-light);flex-wrap:wrap}
.listing-card-details span{white-space:nowrap}
.listing-card-year{font-size:0.73rem;color:var(--text-light);margin-top:4px}
.listing-card-link{
  display:inline-block;font-size:0.72rem;font-weight:500;letter-spacing:0.05em;
  text-transform:uppercase;color:var(--gold);margin-top:4px;transition:color 0.2s;
}
.listing-card-link:hover{color:var(--gold-light)}

/* IDX link at bottom of panel */
.panel-idx-link{
  display:block;text-align:center;padding:14px 20px;
  background:var(--cream);border-top:1px solid var(--cream-dark);
  font-size:0.82rem;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;
  color:var(--gold);transition:background 0.2s, color 0.2s;flex-shrink:0;
}
.panel-idx-link:hover{background:var(--gold);color:var(--white)}

/* CUSTOM POPUP */
.leaflet-popup-content-wrapper{border-radius:0;font-family:var(--font-sans);box-shadow:0 4px 16px rgba(0,0,0,0.2)}
.leaflet-popup-content{margin:0;padding:0}
.hood-popup{padding:20px 24px;min-width:200px}
.hood-popup h3{font-family:var(--font-serif);font-size:1.2rem;color:var(--text-dark);margin-bottom:8px}
.hood-popup p{font-size:0.88rem;color:var(--text-light);margin-bottom:14px;line-height:1.5}
.hood-popup a{display:inline-block;font-size:0.82rem;font-weight:500;letter-spacing:0.06em;
text-transform:uppercase;padding:10px 20px;background:var(--gold);color:var(--white);transition:background 0.3s}
.hood-popup a:hover{background:var(--gold-light)}

/* NEIGHBORHOOD LABELS */
.neighborhood-label{font-family:'Jost',sans-serif;font-size:11px;font-weight:500;
color:#1f4e60;text-align:center;white-space:nowrap;text-shadow:1px 1px 2px rgba(255,255,255,0.9),
-1px -1px 2px rgba(255,255,255,0.9),0 0 6px rgba(255,255,255,0.8)}

/* LISTING MARKERS */
.listing-popup{padding:0;min-width:220px;font-family:var(--font-sans)}
.listing-popup img{width:100%;height:130px;object-fit:cover}
.listing-popup-body{padding:14px 16px}
.listing-popup-price{font-family:var(--font-serif);font-size:1.3rem;color:var(--text-dark);margin-bottom:4px}
.listing-popup-address{font-size:0.82rem;color:var(--text-light);margin-bottom:8px}
.listing-popup-details{font-size:0.82rem;color:var(--text-mid);margin-bottom:10px}
.listing-popup-details span{margin-right:10px}
.listing-popup a{display:block;text-align:center;font-size:0.78rem;font-weight:500;
letter-spacing:0.06em;text-transform:uppercase;padding:8px;background:var(--gold);
color:var(--white);transition:background 0.3s}
.listing-popup a:hover{background:var(--gold-light)}
.listings-loading{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
z-index:800;background:var(--charcoal);color:var(--white);padding:10px 24px;
font-size:0.88rem;box-shadow:0 2px 8px rgba(0,0,0,0.3);display:none}
.listings-loading.active{display:block}
.listings-count{position:absolute;bottom:24px;right:12px;z-index:800;
background:var(--charcoal);color:var(--white);padding:8px 16px;font-size:0.82rem;
box-shadow:0 2px 8px rgba(0,0,0,0.3);display:none}
.listings-count.active{display:block}

/* Highlighted marker */
.listing-marker-highlight div{
  background:#1f4e60 !important;
  transform:scale(1.5);
  transition:transform 0.2s, background 0.2s;
}
@keyframes markerBounce{
  0%,100%{transform:translateY(0)}
  25%{transform:translateY(-14px)}
  50%{transform:translateY(0)}
  75%{transform:translateY(-7px)}
}
.listing-marker-bounce{animation:markerBounce 0.6s ease}

/* Back button */
.back-btn{display:none;position:absolute;top:10px;left:12px;z-index:800;
font-family:var(--font-sans);font-size:0.88rem;font-weight:500;padding:10px 18px;
background:var(--charcoal);color:var(--white);border:none;cursor:pointer;
box-shadow:0 2px 8px rgba(0,0,0,0.3);transition:background 0.3s}
.back-btn:hover{background:var(--gold)}
.back-btn.active{display:block}
.map-header-subtitle{font-size:0.85rem;color:var(--gold);display:none;margin-top:4px}
.map-header-subtitle.active{display:block}

/* MOBILE: nav + bottom sheet */
@media(max-width:768px){
  .nav-links{position:fixed;top:0;right:-100%;width:280px;height:100vh;
  background:var(--charcoal);flex-direction:column;padding:80px 32px;
  gap:24px;transition:right 0.3s ease;box-shadow:-4px 0 20px rgba(0,0,0,0.3)}
  .nav-links.open{right:0}
  .nav-mobile-toggle{display:block}
  .map-header h1{font-size:1.3rem}
  .map-header{padding:16px 20px}

  /* Bottom sheet instead of side panel */
  .map-body{flex-direction:column}
  .listings-panel{
    width:100% !important;min-width:0 !important;
    border-left:none;border-top:1px solid var(--cream-dark);
    position:fixed;bottom:0;left:0;right:0;
    height:0;max-height:70vh;
    transition:height 0.35s ease;
    z-index:900;
    box-shadow:0 -4px 20px rgba(0,0,0,0.15);
  }
  .listings-panel.open{
    height:60vh;
  }

  /* Drag handle */
  .panel-drag-handle{
    display:flex;align-items:center;justify-content:center;
    padding:8px 0 4px;background:var(--white);flex-shrink:0;
  }
  .panel-drag-handle::after{
    content:'';display:block;width:40px;height:4px;
    background:var(--cream-dark);border-radius:2px;
  }

  .panel-header{padding:12px 16px}
  .panel-filters{padding:10px 16px}
  .filter-group{min-width:70px}
  .listing-card{padding:12px 16px}
  .listing-card-photo{width:90px;height:68px}
}

/* Desktop: hide drag handle */
@media(min-width:769px){
  .panel-drag-handle{display:none}
}
</style>
</head>

<script src="gilbert-neighborhoods.js"></script>
<script>
(function(){
  var toggle = document.getElementById('navToggle');
  var links = document.getElementById('navLinks');
  toggle.addEventListener('click', function(){links.classList.toggle('open')});
  links.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){links.classList.remove('open')});
  });

  var map = L.map('map',{zoomControl:true}).setView([33.50,-111.95],10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom:18
  }).addTo(map);

  var searchBase = 'https://www.camelbackhomegroup.com/property-search/results/';

  function searchUrl(coords){
    // Build polygon search URL from coordinates
    // coords is always [[ring],...] — use the longest ring
    var pts = coords.reduce(function(a,b){return a.length>b.length?a:b});
    // Bounding box
    var lats = pts.map(function(p){return p[0]});
    var lons = pts.map(function(p){return p[1]});
    var north = Math.max.apply(null,lats);
    var south = Math.min.apply(null,lats);
    var east = Math.max.apply(null,lons);
    var west = Math.min.apply(null,lons);
    var centerLat = (north+south)/2;
    var centerLon = (east+west)/2;
    // Build WKT polygon (lon lat pairs)
    var wktPts = pts.map(function(p){return p[1]+' '+p[0]}).join(',');
    var wkt = 'POLYGON(('+wktPts+'))';
    var encoded = btoa(wkt);
    return searchBase+'#latlng_'+north+','+south+','+east+','+west+
      '/maplvl_12,'+centerLat+','+centerLon+
      '/mapregion_'+encoded+
      '/view_map/listtypeinclude_Residential/statusinclude_Active/propertysubtypeexclude_Rental/locationmatchtype_AnyOf/';
  }
  var hoodStyle = {color:'#1f4e60',weight:1.5,fillColor:'#cc624c',fillOpacity:0.12};
  var hoverStyle = {fillOpacity:0.35,weight:2.5};
  var drillStyle = {color:'#1f4e60',weight:1.5,fillColor:'#1f4e60',fillOpacity:0.10};
  var drillHover = {fillOpacity:0.30,weight:2.5};

  var metroLayers = L.layerGroup().addTo(map);
  var drillLayers = L.layerGroup();
  var backBtn = document.getElementById('backBtn');
  var mapTitle = document.getElementById('mapTitle');
  var mapSubtitle = document.getElementById('mapSubtitle');
  var drillLabel = document.getElementById('mapDrillLabel');

  // Neighborhood data registry — add more cities here later
  var drillData = {
    'Phoenix': typeof PHOENIX_HOODS !== 'undefined' ? PHOENIX_HOODS : null,
    'Gilbert': typeof GILBERT_HOODS !== 'undefined' ? GILBERT_HOODS : null
  };

  /* ================================================================
     LISTINGS PANEL REFERENCES
     ================================================================ */
  var listingsPanel = document.getElementById('listingsPanel');
  var panelAreaName = document.getElementById('panelAreaName');
  var panelListingCount = document.getElementById('panelListingCount');
  var panelCloseBtn = document.getElementById('panelCloseBtn');
  var panelListings = document.getElementById('panelListings');
  var panelEmpty = document.getElementById('panelEmpty');
  var panelIdxLink = document.getElementById('panelIdxLink');
  var filterApplyBtn = document.getElementById('filterApplyBtn');
  var filterResetBtn = document.getElementById('filterResetBtn');
  var filterMinPrice = document.getElementById('filterMinPrice');
  var filterMaxPrice = document.getElementById('filterMaxPrice');
  var filterMinBeds = document.getElementById('filterMinBeds');
  var filterMinBaths = document.getElementById('filterMinBaths');
  var filterMinSqft = document.getElementById('filterMinSqft');
  var filterMaxSqft = document.getElementById('filterMaxSqft');
  var filterSort = document.getElementById('filterSort');

  // Track current state for re-fetching with filters
  var currentHood = null;
  var currentListings = [];
  var markerMap = {}; // listing id -> {marker, card}

  function openPanel(){
    listingsPanel.classList.add('open');
    // Invalidate map size after transition
    setTimeout(function(){ map.invalidateSize(); }, 380);
  }
  function closePanel(){
    listingsPanel.classList.remove('open');
    setTimeout(function(){ map.invalidateSize(); }, 380);
  }
  panelCloseBtn.addEventListener('click', function(){
    closePanel();
  });

  // Mobile drag handle: tap toggles open/close
  var dragHandle = listingsPanel.querySelector('.panel-drag-handle');
  if(dragHandle){
    dragHandle.addEventListener('click', function(){
      if(listingsPanel.classList.contains('open')){
        closePanel();
      }
    });
  }

  // Filter apply
  filterApplyBtn.addEventListener('click', function(){
    if(currentHood){
      fetchListingsForPolygon(currentHood);
    }
  });

  // Filter reset
  filterResetBtn.addEventListener('click', function(){
    filterMinPrice.value = '';
    filterMaxPrice.value = '';
    filterMinBeds.value = '';
    filterMinBaths.value = '';
    filterMinSqft.value = '';
    filterMaxSqft.value = '';
    filterSort.value = 'price_desc';
    if(currentHood){
      fetchListingsForPolygon(currentHood);
    }
  });

  function getFilterValues(){
    var f = {};
    if(filterMinPrice.value) f.minPrice = parseInt(filterMinPrice.value, 10);
    if(filterMaxPrice.value) f.maxPrice = parseInt(filterMaxPrice.value, 10);
    if(filterMinBeds.value) f.minBeds = parseInt(filterMinBeds.value, 10);
    if(filterMinBaths.value) f.minBaths = parseInt(filterMinBaths.value, 10);
    if(filterMinSqft.value) f.minSqft = parseInt(filterMinSqft.value, 10);
    if(filterMaxSqft.value) f.maxSqft = parseInt(filterMaxSqft.value, 10);
    if(filterSort.value) f.sort = filterSort.value;
    return f;
  }

  /* ================================================================
     PANEL CARD RENDERING
     ================================================================ */
  function renderListingCards(listings, hoodName){
    panelListings.innerHTML = '';
    markerMap = {};

    if(!listings || listings.length === 0){
      panelListings.innerHTML = '<div class="panel-empty">' +
        '<div class="panel-empty-icon">&#8709;</div>' +
        '<div class="panel-empty-text">No listings found in ' + hoodName + '</div></div>';
      panelListingCount.textContent = '0 listings';
      return;
    }

    panelListingCount.textContent = listings.length + ' listing' + (listings.length !== 1 ? 's' : '');

    listings.forEach(function(l){
      var card = document.createElement('div');
      card.className = 'listing-card';
      card.setAttribute('data-id', l.id);

      var photoHtml;
      if(l.photo){
        photoHtml = '<div class="listing-card-photo"><img src="' + l.photo + '" alt="' + escHtml(l.address) + '" loading="lazy"></div>';
      } else {
        photoHtml = '<div class="listing-card-photo"><div class="listing-card-photo-placeholder">No Photo</div></div>';
      }

      var detailParts = [];
      if(l.beds) detailParts.push('<span>' + l.beds + ' bd</span>');
      if(l.baths) detailParts.push('<span>' + l.baths + ' ba</span>');
      if(l.sqft) detailParts.push('<span>' + l.sqft.toLocaleString() + ' sqft</span>');

      var yearHtml = l.yearBuilt ? '<div class="listing-card-year">Built ' + l.yearBuilt + '</div>' : '';

      card.innerHTML = photoHtml +
        '<div class="listing-card-info">' +
        '<div class="listing-card-price">' + formatPrice(l.price) + '</div>' +
        '<div class="listing-card-address">' + escHtml(l.address) + (l.city ? ', ' + escHtml(l.city) : '') + '</div>' +
        '<div class="listing-card-details">' + detailParts.join('') + '</div>' +
        yearHtml +
        '<a class="listing-card-link" href="' + searchBase + '?mlsId=' + l.id + '" target="_blank" onclick="event.stopPropagation()">View Listing</a>' +
        '</div>';

      // Hover: highlight marker
      card.addEventListener('mouseenter', function(){
        highlightMarker(l.id, false);
      });
      card.addEventListener('mouseleave', function(){
        unhighlightMarker(l.id);
      });
      // Click: bounce marker and open popup
      card.addEventListener('click', function(){
        activateListingFromCard(l.id);
      });

      panelListings.appendChild(card);
      markerMap[l.id] = markerMap[l.id] || {};
      markerMap[l.id].card = card;
    });
  }

  function escHtml(str){
    if(!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ================================================================
     MARKER HIGHLIGHT / BOUNCE
     ================================================================ */
  function highlightMarker(listingId, bounce){
    var entry = markerMap[listingId];
    if(!entry || !entry.marker) return;
    var el = entry.marker.getElement();
    if(!el) return;
    el.classList.add('listing-marker-highlight');
    if(bounce){
      el.classList.remove('listing-marker-bounce');
      // Force reflow
      void el.offsetWidth;
      el.classList.add('listing-marker-bounce');
    }
  }
  function unhighlightMarker(listingId){
    var entry = markerMap[listingId];
    if(!entry || !entry.marker) return;
    var el = entry.marker.getElement();
    if(!el) return;
    el.classList.remove('listing-marker-highlight');
    el.classList.remove('listing-marker-bounce');
  }

  function activateListingFromCard(listingId){
    var entry = markerMap[listingId];
    if(!entry || !entry.marker) return;

    // Clear any previous active card
    var prev = panelListings.querySelector('.listing-card.active');
    if(prev) prev.classList.remove('active');

    // Highlight card
    if(entry.card) entry.card.classList.add('active');

    // Pan map to marker
    map.panTo(entry.marker.getLatLng());

    // Bounce marker
    highlightMarker(listingId, true);

    // Open popup
    entry.marker.openPopup();

    // Remove bounce after animation
    setTimeout(function(){
      var el = entry.marker.getElement();
      if(el) el.classList.remove('listing-marker-bounce');
    }, 700);
  }

  /* ================================================================
     POLYGON + ADDPOLYGON (unchanged logic, same drill/popup behavior)
     ================================================================ */
  function addPolygon(hood, layerGroup, style, hover, onClick){
    var layer;
    if(hood.type === 'MultiPolygon'){
      layer = L.polygon(hood.coords, style).addTo(layerGroup);
    } else {
      layer = L.polygon(hood.coords[0], style).addTo(layerGroup);
    }
    var center = layer.getBounds().getCenter();
    L.marker(center, {
      icon: L.divIcon({
        className:'neighborhood-label',
        html:hood.name,
        iconSize:[120,20],
        iconAnchor:[60,10]
      })
    }).addTo(layerGroup);
    layer.on('mouseover',function(){this.setStyle(hover)});
    layer.on('mouseout',function(){this.setStyle(style)});
    if(onClick){
      layer.on('click', onClick);
    } else {
      layer.on('click', function(){
        fetchListingsForPolygon(hood);
      });
      layer.bindPopup(
        '<div class="hood-popup">'+
        '<h3>'+hood.name+'</h3>'+
        '<p>'+hood.desc+'</p>'+
        '<a href="'+searchUrl(hood.coords)+'" target="_blank">Search Homes in '+hood.name+'</a>'+
        '</div>',
        {maxWidth:280}
      );
    }
    return layer;
  }

  // Build metro view
  function buildMetro(){
    // Tribal lands
    var tribalStyle = {color:'#6a8290',weight:1,fillColor:'#6a8290',fillOpacity:0.1,dashArray:'6 3'};
    MAPDATA.tribal.forEach(function(t){
      var tLayer;
      if(t.type === 'MultiPolygon'){
        tLayer = L.polygon(t.coords, tribalStyle).addTo(metroLayers);
      } else {
        tLayer = L.polygon(t.coords[0], tribalStyle).addTo(metroLayers);
      }
      var center = tLayer.getBounds().getCenter();
      L.marker(center, {
        icon: L.divIcon({
          className:'neighborhood-label',
          html:'<span style="color:#6a8290;font-style:italic">'+t.name+'</span>',
          iconSize:[160,20],
          iconAnchor:[80,10]
        })
      }).addTo(metroLayers);
    });

    // Cities
    MAPDATA.neighborhoods.forEach(function(hood){
      var hasDrill = drillData[hood.name] ? true : false;
      var clickFn = null;
      if(hasDrill){
        clickFn = function(){ drillInto(hood.name); };
      }
      var layer = addPolygon(hood, metroLayers, hoodStyle, hoverStyle, clickFn);
      if(!hasDrill){
        layer.bindPopup(
          '<div class="hood-popup">'+
          '<h3>'+hood.name+'</h3>'+
          '<p>'+hood.desc+'</p>'+
          '<a href="'+searchUrl(hood.coords)+'" target="_blank">Search Homes in '+hood.name+'</a>'+
          '</div>',
          {maxWidth:280}
        );
      }
    });
  }

  function drillInto(cityName){
    var hoods = drillData[cityName];
    if(!hoods) return;

    map.closePopup();
    map.removeLayer(metroLayers);
    drillLayers.clearLayers();
    drillLayers.addTo(map);

    hoods.forEach(function(hood){
      addPolygon(hood, drillLayers, drillStyle, drillHover);
    });

    // Zoom to fit
    var bounds = drillLayers.getBounds();
    map.fitBounds(bounds, {padding:[40,40]});

    // Update UI
    backBtn.classList.add('active');
    mapTitle.textContent = cityName + ' Neighborhoods';
    mapSubtitle.textContent = 'Click a neighborhood to search homes';
    drillLabel.textContent = 'Viewing neighborhoods within ' + cityName;
    drillLabel.classList.add('active');
  }

  /* ================================================================
     LISTING MARKERS
     ================================================================ */
  var listingMarkers = L.layerGroup().addTo(map);
  var loadingEl = document.getElementById('listingsLoading');
  var countEl = document.getElementById('listingsCount');
  var listingIcon = L.divIcon({
    className:'',
    html:'<div style="width:12px;height:12px;background:#cc624c;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,0.4)"></div>',
    iconSize:[12,12],
    iconAnchor:[6,6]
  });

  function formatPrice(n){
    if(n>=1000000) return '$'+(n/1000000).toFixed(1)+'M';
    if(n>=1000) return '$'+(n/1000).toFixed(0)+'K';
    return '$'+n;
  }

  function fetchListingsForPolygon(hood){
    currentHood = hood;
    // Extract the largest polygon ring from coords
    var pts;
    if(hood.type === 'MultiPolygon'){
      pts = hood.coords.reduce(function(a,b){return a.length>b.length?a:b});
    } else {
      pts = hood.coords[0];
    }
    // Simplify polygon for API (max ~30 points)
    var step = Math.max(1, Math.floor(pts.length / 30));
    var simplified = [];
    for(var i=0;i<pts.length;i+=step){ simplified.push(pts[i]); }

    loadingEl.classList.add('active');
    countEl.classList.remove('active');
    listingMarkers.clearLayers();

    // Update panel header and show panel
    panelAreaName.textContent = hood.name;
    panelListingCount.textContent = '';
    panelListings.innerHTML = '<div class="panel-loading"><div class="panel-loading-spinner"></div>Loading listings...</div>';
    panelIdxLink.href = searchUrl(hood.coords);
    panelIdxLink.style.display = 'block';
    openPanel();

    // Build request body with filters
    var body = {
      polygon: simplified,
      limit: 200
    };
    var filters = getFilterValues();
    if(filters.minPrice) body.minPrice = filters.minPrice;
    if(filters.maxPrice) body.maxPrice = filters.maxPrice;
    if(filters.minBeds) body.minBeds = filters.minBeds;
    if(filters.minBaths) body.minBaths = filters.minBaths;
    if(filters.minSqft) body.minSqft = filters.minSqft;
    if(filters.maxSqft) body.maxSqft = filters.maxSqft;
    if(filters.sort) body.sort = filters.sort;

    fetch('/.netlify/functions/listings',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    })
    .then(function(r){return r.json()})
    .then(function(data){
      loadingEl.classList.remove('active');
      currentListings = data.listings || [];

      if(!data.listings || data.listings.length===0){
        countEl.textContent = 'No listings in '+hood.name;
        countEl.classList.add('active');
        renderListingCards([], hood.name);
        return;
      }

      // Build map markers and populate panel
      data.listings.forEach(function(l){
        var photoHtml = l.photo ? '<img src="'+l.photo+'" alt="'+escHtml(l.address)+'">' : '';
        var marker = L.marker([l.lat,l.lng],{icon:listingIcon}).addTo(listingMarkers);
        marker.bindPopup(
          '<div class="listing-popup">'+
          photoHtml+
          '<div class="listing-popup-body">'+
          '<div class="listing-popup-price">'+formatPrice(l.price)+'</div>'+
          '<div class="listing-popup-address">'+escHtml(l.address)+(l.city?', '+escHtml(l.city):'')+'</div>'+
          '<div class="listing-popup-details">'+
          (l.beds?'<span>'+l.beds+' bed</span>':'')+
          (l.baths?'<span>'+l.baths+' bath</span>':'')+
          (l.sqft?'<span>'+l.sqft.toLocaleString()+' sqft</span>':'')+
          '</div>'+
          '<a href="'+searchBase+'?mlsId='+l.id+'" target="_blank">View Listing</a>'+
          '</div></div>',
          {maxWidth:260,minWidth:220}
        );

        // When popup opens from map click, highlight card in panel
        marker.on('popupopen', function(){
          var prev = panelListings.querySelector('.listing-card.active');
          if(prev) prev.classList.remove('active');
          var entry = markerMap[l.id];
          if(entry && entry.card){
            entry.card.classList.add('active');
            entry.card.scrollIntoView({behavior:'smooth', block:'nearest'});
          }
        });
        marker.on('popupclose', function(){
          var entry = markerMap[l.id];
          if(entry && entry.card) entry.card.classList.remove('active');
          unhighlightMarker(l.id);
        });

        // Store marker reference
        if(!markerMap[l.id]) markerMap[l.id] = {};
        markerMap[l.id].marker = marker;
      });

      countEl.textContent = data.listings.length+' listings in '+hood.name;
      countEl.classList.add('active');

      // Render cards in side panel
      renderListingCards(data.listings, hood.name);
    })
    .catch(function(){
      loadingEl.classList.remove('active');
      panelListings.innerHTML = '<div class="panel-empty">' +
        '<div class="panel-empty-icon">&#9888;</div>' +
        '<div class="panel-empty-text">Failed to load listings. Please try again.</div></div>';
      panelListingCount.textContent = '';
    });
  }

  function clearListings(){
    listingMarkers.clearLayers();
    countEl.classList.remove('active');
    currentHood = null;
    currentListings = [];
    markerMap = {};
  }

  function filterListingsToView(){
    if(!currentListings || currentListings.length === 0) return;
    var bounds = map.getBounds();
    var visible = currentListings.filter(function(l){
      return bounds.contains([l.lat, l.lng]);
    });

    // Update markers — show only visible
    listingMarkers.clearLayers();
    markerMap = {};
    visible.forEach(function(l){
      var marker = L.marker([l.lat,l.lng],{icon:listingIcon}).addTo(listingMarkers);
      var photoHtml = l.photo ? '<img src="'+l.photo+'" alt="'+escHtml(l.address)+'">' : '';
      marker.bindPopup(
        '<div class="listing-popup">'+
        photoHtml+
        '<div class="listing-popup-body">'+
        '<div class="listing-popup-price">'+formatPrice(l.price)+'</div>'+
        '<div class="listing-popup-address">'+escHtml(l.address)+(l.city?', '+escHtml(l.city):'')+'</div>'+
        '<div class="listing-popup-details">'+
        (l.beds?'<span>'+l.beds+' bed</span>':'')+
        (l.baths?'<span>'+l.baths+' bath</span>':'')+
        (l.sqft?'<span>'+l.sqft.toLocaleString()+' sqft</span>':'')+
        '</div>'+
        '<a href="'+searchBase+'?mlsId='+l.id+'" target="_blank">View Listing</a>'+
        '</div></div>',
        {maxWidth:260,minWidth:220}
      );
      marker.on('click', function(){
        highlightCard(l.id);
      });
      marker.on('popupclose', function(){
        var entry = markerMap[l.id];
        if(entry && entry.card) entry.card.classList.remove('active');
        unhighlightMarker(l.id);
      });
      if(!markerMap[l.id]) markerMap[l.id] = {};
      markerMap[l.id].marker = marker;
    });

    // Update panel cards
    renderListingCards(visible, currentHood ? currentHood.name : '');
    countEl.textContent = visible.length + ' of ' + currentListings.length + ' listings in view';
    countEl.classList.add('active');
  }

  var viewFilterTimer;
  map.on('moveend', function(){
    if(!currentListings || currentListings.length === 0) return;
    clearTimeout(viewFilterTimer);
    viewFilterTimer = setTimeout(filterListingsToView, 300);
  });

  function backToMetro(){
    map.removeLayer(drillLayers);
    drillLayers.clearLayers();
    clearListings();
    closePanel();
    metroLayers.addTo(map);
    map.setView([33.50,-111.95],10);

    backBtn.classList.remove('active');
    mapTitle.textContent = 'Explore Phoenix Metro Neighborhoods';
    mapSubtitle.textContent = 'Click any city to explore neighborhoods';
    drillLabel.classList.remove('active');
  }

  backBtn.addEventListener('click', backToMetro);
  buildMetro();
})();
</script>
</body>
</html>
