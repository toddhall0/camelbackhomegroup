[build]
  publish = "."
  functions = "netlify/functions"

[functions."crm-email-sync"]
  schedule = "0 14 * * *"  # 7 AM Arizona time (cron is UTC)

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
