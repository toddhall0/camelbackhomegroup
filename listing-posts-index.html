<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listing Posts Index — Camelback Home Group (Admin)</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--charcoal:#1f4e60;--gold:#cc624c;--cream:#f2f0ec;--text-dark:#162d38;--text-mid:#3d5a68;--text-light:#6a8290;--white:#fff}
body{font-family:Jost,sans-serif;background:var(--cream);color:var(--text-dark);padding:32px 24px;max-width:900px;margin:0 auto}
h1{font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--charcoal);margin-bottom:8px}
.subtitle{font-size:0.9rem;color:var(--text-light);margin-bottom:32px}
.count{font-size:0.85rem;color:var(--gold);font-weight:500;margin-bottom:16px}
.post-list{display:flex;flex-direction:column;gap:12px}
.post-item{display:flex;align-items:center;gap:16px;background:var(--white);border-radius:12px;padding:16px 20px;text-decoration:none;color:inherit;transition:transform 0.2s,box-shadow 0.2s}
.post-item:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.post-thumb{width:80px;height:56px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--cream)}
.post-info{flex:1;min-width:0}
.post-title{font-size:0.95rem;font-weight:500;color:var(--text-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-meta{font-size:0.8rem;color:var(--text-light);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.post-price{font-weight:500;color:var(--gold)}
.post-city{color:var(--charcoal)}
.post-date{color:var(--text-light)}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2d8a5e;margin-right:4px;vertical-align:middle}
</style>
</head>
<body>
<h1>Listing Spotlight Posts</h1>
<p class="subtitle">Admin index — not linked from the site. Each post lives at <code>/homes/[slug]</code></p>
<div class="count" id="count"></div>
<div class="post-list" id="postList"></div>

<script src="listing-posts-data.js"></script>
<script>
(function(){
  var list = document.getElementById('postList');
  var count = document.getElementById('count');
  count.textContent = LISTING_POSTS.length + ' posts';

  function formatPrice(n){
    if(!n) return '';
    if(n>=1000000) return '$'+(n/1000000).toFixed(1)+'M';
    return '$'+(n/1000).toFixed(0)+'K';
  }

  LISTING_POSTS.forEach(function(p){
    var a = document.createElement('a');
    a.className = 'post-item';
    a.href = '/homes/' + p.slug;
    a.target = '_blank';

    var imgHtml = p.image
      ? '<img class="post-thumb" src="'+p.image+'" alt="" loading="lazy">'
      : '<div class="post-thumb"></div>';

    a.innerHTML = imgHtml +
      '<div class="post-info">' +
        '<div class="post-title"><span class="status-dot"></span>' + p.title + '</div>' +
        '<div class="post-meta">' +
          '<span class="post-price">' + formatPrice(p.price) + '</span>' +
          '<span class="post-city">' + (p.city||'') + '</span>' +
          (p.beds ? '<span>' + p.beds + ' bed / ' + p.baths + ' bath</span>' : '') +
          '<span class="post-date">' + (p.date||'') + '</span>' +
          (p.listingOffice ? '<span>via ' + p.listingOffice + '</span>' : '') +
        '</div>' +
      '</div>';

    list.appendChild(a);
  });
})();
</script>
</body>
</html>
