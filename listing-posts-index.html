<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listing Posts Index — Camelback Home Group (Admin)</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--charcoal:#1f4e60;--gold:#cc624c;--cream:#f2f0ec;--text-dark:#162d38;--text-mid:#3d5a68;--text-light:#6a8290;--white:#fff}
body{font-family:Jost,sans-serif;background:var(--cream);color:var(--text-dark);padding:32px 24px;max-width:1100px;margin:0 auto}
h1{font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--charcoal);margin-bottom:8px}
.subtitle{font-size:0.9rem;color:var(--text-light);margin-bottom:24px}
.count{font-size:0.85rem;color:var(--gold);font-weight:500;margin-bottom:16px}

table{width:100%;border-collapse:separate;border-spacing:0;background:var(--white);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
thead{background:var(--charcoal);color:var(--white)}
th{padding:12px 16px;text-align:left;font-size:0.82rem;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;user-select:none;white-space:nowrap;transition:background 0.2s}
th:hover{background:#275d72}
th.sorted-asc::after{content:' ▲';font-size:0.7rem}
th.sorted-desc::after{content:' ▼';font-size:0.7rem}
td{padding:10px 16px;font-size:0.9rem;border-bottom:1px solid #f0ece6;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background 0.15s;cursor:pointer}
tbody tr:hover{background:#faf8f5}
.thumb{width:60px;height:42px;border-radius:6px;object-fit:cover;display:block}
.price-cell{font-weight:500;color:var(--gold);white-space:nowrap}
.city-cell{font-weight:500;color:var(--charcoal)}
.link-cell a{color:var(--gold);text-decoration:underline;font-size:0.85rem}
.link-cell a:hover{color:#d97965}
.mls-cell{font-size:0.82rem;color:var(--text-light)}
.office-cell{font-size:0.82rem;color:var(--text-light);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media(max-width:768px){
  th,td{padding:8px 10px;font-size:0.82rem}
  .thumb{width:48px;height:34px}
  .hide-mobile{display:none}
}
</style>
</head>
<body>
<h1>Listing Spotlight Posts</h1>
<p class="subtitle">Admin index — not linked from the site. Click any column header to sort. Click a row to open the post.</p>
<div class="count" id="count"></div>

<table id="postsTable">
<thead>
<tr>
  <th data-col="image" style="cursor:default"></th>
  <th data-col="address">Address</th>
  <th data-col="city">City</th>
  <th data-col="price">Price</th>
  <th data-col="beds">Beds</th>
  <th data-col="baths">Baths</th>
  <th data-col="sqft" class="hide-mobile">Sqft</th>
  <th data-col="date">Date</th>
  <th data-col="mlsNumber" class="hide-mobile">MLS #</th>
  <th data-col="listingOffice" class="hide-mobile">Office</th>
  <th data-col="link" style="cursor:default">Link</th>
</tr>
</thead>
<tbody id="postsBody"></tbody>
</table>

<script src="listing-posts-data.js"></script>
<script>
(function(){
  var tbody = document.getElementById('postsBody');
  var count = document.getElementById('count');
  var posts = LISTING_POSTS.slice();
  var currentSort = '';
  var sortDir = 1;

  function formatPrice(n){
    if(!n) return '';
    return '$' + n.toLocaleString();
  }

  function render(){
    count.textContent = posts.length + ' posts';
    tbody.innerHTML = '';
    posts.forEach(function(p){
      var tr = document.createElement('tr');
      tr.onclick = function(){ window.open('/homes/' + p.slug, '_blank') };
      tr.innerHTML =
        '<td>' + (p.image ? '<img class="thumb" src="'+p.image+'" alt="" loading="lazy">' : '') + '</td>' +
        '<td>' + (p.address||p.title) + '</td>' +
        '<td class="city-cell">' + (p.city||'') + '</td>' +
        '<td class="price-cell">' + formatPrice(p.price) + '</td>' +
        '<td>' + (p.beds||'') + '</td>' +
        '<td>' + (p.baths||'') + (p.halfBaths ? '.5' : '') + '</td>' +
        '<td class="hide-mobile">' + (p.sqft ? p.sqft.toLocaleString() : '') + '</td>' +
        '<td>' + (p.date||'') + '</td>' +
        '<td class="mls-cell hide-mobile">' + (p.mlsNumber||'') + '</td>' +
        '<td class="office-cell hide-mobile" title="' + (p.listingOffice||'') + '">' + (p.listingOffice||'') + '</td>' +
        '<td class="link-cell"><a href="/homes/' + p.slug + '" target="_blank" onclick="event.stopPropagation()">View</a></td>';
      tbody.appendChild(tr);
    });
  }

  // Sortable headers
  document.querySelectorAll('th[data-col]').forEach(function(th){
    if(th.style.cursor === 'default') return;
    th.addEventListener('click', function(){
      var col = th.dataset.col;
      if(currentSort === col){ sortDir *= -1; }
      else { currentSort = col; sortDir = 1; }

      // Update header styles
      document.querySelectorAll('th').forEach(function(h){h.classList.remove('sorted-asc','sorted-desc')});
      th.classList.add(sortDir === 1 ? 'sorted-asc' : 'sorted-desc');

      posts.sort(function(a,b){
        var va = a[col], vb = b[col];
        if(va == null) va = '';
        if(vb == null) vb = '';
        if(typeof va === 'number' && typeof vb === 'number') return (va - vb) * sortDir;
        va = String(va).toLowerCase();
        vb = String(vb).toLowerCase();
        if(va < vb) return -1 * sortDir;
        if(va > vb) return 1 * sortDir;
        return 0;
      });
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
